name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PLATFORMIO_VERSION: "6.1.19"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32s3dev
          - esp32s2dev
          - esp32s3dev_legacy_54

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ env.PLATFORMIO_VERSION }}-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'library.json') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ env.PLATFORMIO_VERSION }}-native-${{ hashFiles('platformio.ini', 'library.json') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Check generated version header
        run: python scripts/generate_version.py check

      - name: Check release metadata consistency
        run: python tools/check_metadata_consistency.py

      - name: Enforce core timing guard
        run: python tools/check_core_timing_guard.py

      - name: Test HIL parser and strict gates
        run: python tools/hil_runner.py --parser-self-test

      - name: Run native tests
        run: pio test -e native

  esp-idf-build:
    runs-on: ubuntu-24.04
    container: espressif/idf:${{ matrix.idf_version }}
    strategy:
      fail-fast: false
      matrix:
        idf_version:
          - v6.0.1
          - v6.0.2
        idf_target:
          - esp32s3
          - esp32s2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show ESP-IDF version
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py --version

      - name: Build ESP-IDF example for ${{ matrix.idf_target }}
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C examples/espidf_basic set-target ${{ matrix.idf_target }} build

  validate-library:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ env.PLATFORMIO_VERSION }}-validate-${{ hashFiles('platformio.ini', 'library.json') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Enforce example CLI contract
        run: python tools/check_cli_contract.py

      - name: Enforce ESP-IDF example contract
        run: python tools/check_idf_example_contract.py

      - name: Pack and validate library package
        run: |
          mkdir -p .pio/package-validation
          pio pkg pack --output .pio/package-validation/MB85RC.tar.gz
          python tools/check_package_contents.py .pio/package-validation/MB85RC.tar.gz

  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Build Doxygen documentation
        run: doxygen Doxyfile
